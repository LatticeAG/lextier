[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lextier"
version = "0.1.0"
description = "LexTier — deterministic per-tool approval tiers and signed audit gateway (protocol lextier/1)"
readme = "../README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "cryptography>=41",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["lextier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
